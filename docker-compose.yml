version: '3.8'

services:
  app-service:
    image: devops-app:latest
    container_name: devops-app
    ports:
      - "8082:8082"
    depends_on:
      - mysqldb

  mysqldb:
    image: mysql:8.0
    container_name: mysqldb
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=devopsdb
